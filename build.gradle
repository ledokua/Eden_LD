plugins {
    id 'fabric-loom' version '1.18-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


repositories {
    mavenCentral()

    // Minestar (local jar)
    flatDir {
        dirs("libs")
    }

    maven { name = "Modrinth"; url = "https://api.modrinth.com/maven"; content { includeGroup "maven.modrinth" } }
    maven { name = "Nucleoid"; url = "https://maven.nucleoid.xyz/"; content { includeGroup "eu.pb4" } }
    maven { name = "TwelveIterations"; url = "https://maven.twelveiterations.com/repository/maven-public/"; content { includeGroup "net.blay09.mods" } }
    maven { name = "Xaero"; url = "https://chocolateminecraft.com/maven/"; content { includeGroup "xaero.pac" } }
    maven { name = "TerraformersMC"; url = "https://maven.terraformersmc.com/releases/"; content { includeGroup "dev.emi" } }
    maven { name = "Puffish"; url = "https://maven.puffish.net"; content { includeGroup "net.puffish" } }
    maven { name = "Wisp Forest"; url = "https://maven.wispforest.io/releases/"; content { includeGroupByRegex "io\\.wispforest(\\..*)?" } }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Minestar platform mod (installed on the server separately)
    modCompileOnly "minestar:minestar-fabric:1.5.0"

    // LuckPerms (provided by the LuckPerms mod at runtime)
    compileOnly "net.luckperms:api:5.4"

    // VectorLib (hub screens) — bundled jar-in-jar; flatDir gives the jar module
    // coordinates so Loom's `include` accepts it (dedupes if installed standalone)
    modImplementation files("libs/VectorLib-fabric.jar")
    include ":VectorLib-fabric"

    // BusyLib (busy-state gating) — required, installed on the server separately
    modImplementation files("libs/BusyLib-fabric-1.0-SNAPSHOT.jar")

    // Spell Engine / Better Combat — optional compat: party-aware friendly fire
    modCompileOnly("maven.modrinth:spell-engine:1.10.7+1.21.1-fabric") { transitive = false }
    modCompileOnly("maven.modrinth:better-combat:2.4.0+1.21.1-fabric") { transitive = false }

    // Placeholder API — optional: %eden_ld:guild_tag% for Styled Chat / Styled Player List formats
    modCompileOnly("eu.pb4:placeholder-api:2.4.2+1.21") { transitive = false }
    // Pufferfish Skills: an activity level from a skill tree (activities.level_category).
    modCompileOnly("net.puffish:skillsmod:0.16.5+1.21:fabric") { transitive = false }

    // Blay's Waystones (+ Balm) — optional compat: the hub's Waystones tab
    modCompileOnly("net.blay09.mods:waystones-fabric:21.1.42+1.21.1") { transitive = false }
    modCompileOnly("net.blay09.mods:balm-fabric:21.0.65+1.21.1") { transitive = false }

    // Open Parties and Claims — optional: guilds as OPAC's party system (guild-owned claims)
    modCompileOnly("xaero.pac:open-parties-and-claims-fabric-1.21.1:0.31.6") { transitive = false }

    // Economy_LD — optional: mail storage and API behind the hub's Mail tab (copy of its built jar;
    // refresh it when Economy_LD's mail API changes). In the dev client too, to test the Mail tab.
    // EMI — optional: drag items from its panel into the Moderation window's mail slots, and the
    // rejoin fix (EmiReloadFix), which needs its reload manager — the full jar, not just the API.
    modCompileOnly("dev.emi:emi-fabric:1.1.24+1.21.1") { transitive = false }
    modLocalRuntime("dev.emi:emi-fabric:1.1.24+1.21.1") { transitive = false }

    // Trinkets + Stylish Effects — optional: the effect widgets start left of Trinkets' slot columns
    // (TrinketsEffectsArea), and EMI's panels keep clear of them (StylishEffectsEmi)
    modCompileOnly("maven.modrinth:trinkets:3.10.0") { transitive = false }
    modCompileOnly("maven.modrinth:stylish-effects:v21.1.3-1.21.1-Fabric") { transitive = false }

    // BanHammer — optional: the Moderation window's Players and Punishments sections (server-only
    // mod; the servers run 0.11.1)
    modCompileOnly("maven.modrinth:banhammer:0.11.1+1.21") { transitive = false }
    // Dev server only (BanHammer is a server-side mod): ./gradlew runServer
    modLocalRuntime("maven.modrinth:banhammer:0.11.1+1.21") { transitive = false }
    // Its bundled libraries, taken out of its jar (a dev run doesn't load jar-in-jar from a local runtime mod).
    modLocalRuntime files("devlibs/banhammer/fabric-permissions-api-0.3.1.jar",
            "devlibs/banhammer/placeholder-api-2.4.0-pre.2+1.21.jar", "devlibs/banhammer/sgui-1.5.0+1.20.5.jar")

    // Arenas_LD / Duels_LD — optional: the Activities tab's dungeons, raids and arenas (ArenasApi)
    // and the Duels tab (DuelsApi). Copies of their built jars; refresh them when those APIs change.
    modCompileOnly files("libs/arenas_ld-fabric-4.6.0.jar")
    modCompileOnly files("libs/duels_ld-1.4.0.jar")
    // In the dev client too, to see both tabs (Duels needs owo-lib).
    modLocalRuntime files("libs/arenas_ld-fabric-4.6.0.jar", "libs/duels_ld-1.4.0.jar")
    modLocalRuntime "io.wispforest:owo-lib:0.12.15.4+1.21"

    // FTB Teams (FTB Quests needs it) — optional: Eden refuses its parties (FtbTeamsCompat).
    // A copy of the pack's jar.
    modCompileOnly files("libs/ftb-teams-fabric-2101.1.11.jar")

    modCompileOnly files("libs/Economy_LD-1.0.jar")
    modLocalRuntime files("libs/Economy_LD-1.0.jar")
    // Its bundled SQLite driver isn't unpacked from a local jar in the dev run.
    localRuntime "org.xerial:sqlite-jdbc:3.49.1.0"
}

loom {
    runs {
        // Its own folder, so a dev server and a dev client can run side by side.
        server {
            runDir "run-server"
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
